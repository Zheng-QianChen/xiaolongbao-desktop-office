name: Windows package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop-pet/requirements-build.txt
      - run: python -m unittest discover -s desktop-pet -p "test_*.py"
      - run: python desktop-pet/packaging/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Xiaolongbao-Desktop-Office-windows-x64
          path: desktop-pet/release/*
